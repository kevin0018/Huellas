x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: Huellas_frontend
    environment:
      API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
      VITE_SOCKET_URL: /
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules
    depends_on:
      - api
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 150
    logging: *default-logging
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: Huellas_api
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      DATABASE_URL: mysql://appuser:apppass@mysql:3306/huellas
      DB_HOST: mysql
      DB_NAME: huellas
      DB_PASSWORD: apppass
      DB_PORT: "3306"
      DB_USER: appuser
      JWT_SECRET: "${JWT_SECRET:-huellas-local-development-only}"
      NODE_ENV: development
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      SHADOW_DATABASE_URL: mysql://root:root@mysql:3306/huellas_shadow
    ports:
      - "${PORT:-3000}:3000"
      - "5555:5555"
    volumes:
      - .:/app:cached
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "pnpm prisma:deploy && pnpm dev"]
    cpus: 1.00
    mem_limit: 768m
    pids_limit: 200
    logging: *default-logging
  mysql:
    image: mysql:8.4
    container_name: Huellas_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: huellas
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: 1.00
    mem_limit: 768m
    pids_limit: 200
    logging: *default-logging
  redis:
    image: redis:7-alpine
    container_name: Huellas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 100
    logging: *default-logging
  adminer:
    image: adminer:latest
    container_name: huellas_adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 100
    logging: *default-logging
volumes:
  mysql_data:
  redis_data:
